# Filename Cargo.toml  Version 0.2.1

[package]
name = "foodlog"
version = "0.1.1"
description = "Foodlog desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "foodlog"
path = "src/main.rs"
