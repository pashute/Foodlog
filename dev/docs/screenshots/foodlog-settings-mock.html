<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Foodlog — Settings (mock)</title>
<style>
  :root {
    --text: #9ca3af;
    --text-h: #f3f4f6;
    --bg: #16171d;
    --card-bg: #1c1d24;
    --border: #2e303a;
    --accent: #c084fc;
    --accent-link: #7aa2ff;
    --green-bg: #16321f;
    --green-text: #4ade80;
    --pink: #f472b6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0b0d;
    font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 375px;
    height: 812px;
    background: var(--bg);
    border-radius: 44px;
    border: 10px solid #000;
    overflow: hidden;
    position: relative;
    color: var(--text);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
  }
  .notch {
    width: 100px;
    height: 6px;
    background: #3a3b44;
    border-radius: 3px;
    margin: 16px auto 12px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px 16px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-h);
  }
  .brand .ver {
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    margin-left: 6px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #3b5a8a;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .username {
    font-size: 14px;
    color: var(--text-h);
  }
  .hamburger {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 4px;
  }
  .hamburger span {
    width: 20px;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
  }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 24px;
  }
  .content::-webkit-scrollbar { display: none; }
  .section-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 19px;
    font-weight: 700;
    color: var(--text-h);
  }
  .donate-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #26272f;
    border: 1px solid var(--border);
    color: var(--text-h);
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 20px;
  }
  .donate-btn .heart { color: var(--pink); }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 15px;
  }
  .row + .row { border-top: 1px solid var(--border); }
  .row .label { color: var(--text); }
  .row .value { color: var(--text-h); }
  .card-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-h);
  }
  .info-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid #4b4d58;
    color: var(--text);
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-style: italic;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .btn {
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #26272f;
    color: var(--text-h);
  }
  .btn.set {
    background: var(--green-bg);
    color: var(--green-text);
    border-color: #245030;
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
  }
  .helper-text {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text);
  }
  .helper-text .key { color: var(--text-h); }
  .tz-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .tz-place { font-size: 15px; color: var(--text-h); }
  .link {
    color: var(--accent-link);
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .led {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 7px;
  }
  .led.green { background: var(--green-text); box-shadow: 0 0 6px var(--green-text); }
  .status-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
  }
  .status-label { color: var(--text-h); font-size: 14.5px; }
  .go-btn {
    width: 100%;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 0;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #1a0f27;
    margin: 6px 0 10px;
  }
  .footer-note {
    font-size: 12.5px;
    color: var(--text);
    text-align: center;
    min-height: 1.5em;
  }
  .key-left {
    display: flex;
    align-items: center;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="header">
      <div class="brand">Foodlog<span class="ver">v0.1.1</span></div>
      <div class="header-right">
        <div class="avatar">P</div>
        <div class="username">pashute</div>
        <div class="hamburger"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div class="content">
      <div class="section-title-row">
        <div class="section-title">Settings</div>
        <div class="donate-btn"><span class="heart">&#9825;</span> Donate</div>
      </div>

      <div class="card" data-instruction="Look and feel of the app. Dark by default.">
        <div class="row"><span class="label">Theme</span><span class="value">Dark</span></div>
      </div>

      <div class="card" data-instruction="Your Gemini API key, used to privately estimate carbs and energy from your meal text.">
        <div class="tz-row">
          <div class="key-left"><span class="led green"></span><span class="status-label">Gemini key ok</span></div>
          <div class="btn">Import</div>
        </div>
      </div>

      <div class="card" data-instruction="This app setting only. Does not change your system's timezone.">
        <div class="tz-row">
          <div class="tz-place">IDT Jerusalem, Israel UTC+3.0</div>
          <div class="btn">Change</div>
        </div>
      </div>

      <div class="card" data-instruction="Your Foodlog Google Sheet — created automatically on first login.">
        <div class="tz-row">
          <div class="tz-place">Foodlog</div>
          <a class="link" href="#">Open in Google Sheets &#8599;</a>
        </div>
      </div>

      <button class="go-btn">Go to App</button>
      <div class="footer-note" id="instruction">All set — logged in as pashute.</div>
    </div>
  </div>
  <script>
    // Demo only: the single bottom instruction area updates per hovered
    // element. Not shown by a static screenshot (no hover state), but
    // matches how the real Settings screen should behave.
    var instruction = document.getElementById('instruction')
    var defaultText = instruction.textContent
    document.querySelectorAll('[data-instruction]').forEach(function (el) {
      el.addEventListener('mouseenter', function () {
        instruction.textContent = el.getAttribute('data-instruction')
      })
      el.addEventListener('mouseleave', function () {
        instruction.textContent = defaultText
      })
    })
  </script>
</body>
</html>
